name: Validate
on: [push, pull_request]
jobs:
  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install linters
        run: brew install shellcheck stow

      - name: Shellcheck bash scripts
        run: |
          shellcheck scripts/*.sh install.sh
          shellcheck dotfiles/claude/.claude/statusline.sh dotfiles/claude/.claude/hooks/*.sh

      - name: Zsh syntax
        run: |
          zsh -n dotfiles/zsh/.zshrc
          zsh -n dotfiles/zsh/.zshenv
          zsh -n dotfiles/zsh/.zprofile

      - name: Brewfiles parse
        run: |
          brew bundle list --all --file=brew/Brewfile.base >/dev/null
          brew bundle list --all --file=brew/Brewfile.apps >/dev/null

      - name: JSON and TOML configs parse
        run: |
          for f in $(git ls-files 'dotfiles/**/*.json' '*.json'); do jq . "$f" >/dev/null || { echo "bad json: $f"; exit 1; }; done
          for f in $(git ls-files 'dotfiles/**/*.toml'); do python3 -c "import sys,tomllib; tomllib.load(open(sys.argv[1],'rb'))" "$f" || { echo "bad toml: $f"; exit 1; }; done

      - name: Stow dry-run (fails on conflicts between packages)
        run: |
          target=$(mktemp -d)
          for pkg in dotfiles/*/; do
            stow --no-folding --simulate -d dotfiles -t "$target" "$(basename "$pkg")"
          done

      - name: Makefile syntax
        run: make -n help
