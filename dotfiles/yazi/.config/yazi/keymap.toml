# Yazi Keymap Configuration
# https://yazi-rs.github.io/docs/configuration/keymap
# Only additions live here (prepend_keymap); the yazi preset keymap stays intact.
#:schema https://yazi-rs.github.io/schemas/keymap.json

[mgr]
prepend_keymap = [
  { on = ["g", "r"], run = "cd ~/repos", desc = "Go to ~/repos" },
  { on = ["g", "o"], run = "cd ~/Documents/Obsidian", desc = "Go to Obsidian vault" },
  { on = ["g", "w"], run = "cd ~/repos/macos", desc = "Go to workstation config" },
  { on = "O", run = 'shell -- open -R "$1"', desc = "Reveal in Finder" },
  { on = ["m", "s"], run = "linemode size", desc = "Linemode: size" },
  { on = ["m", "p"], run = "linemode permissions", desc = "Linemode: permissions" },
  { on = ["m", "m"], run = "linemode mtime", desc = "Linemode: mtime" },
  { on = ["m", "n"], run = "linemode none", desc = "Linemode: none" },
]
