# Yazi - Terminal File Manager Configuration
# https://yazi-rs.github.io/docs/configuration/yazi
# Only overrides live here; everything else is the yazi preset.
#:schema https://yazi-rs.github.io/schemas/yazi.json

[flavor]
dark = "catppuccin-frappe"
light = "catppuccin-frappe"

[mgr]
ratio = [1, 4, 3]
sort_by = "natural"
sort_sensitive = false
sort_reverse = false
sort_dir_first = true
linemode = "size"
show_hidden = false
show_symlink = true

[preview]
tab_size = 2
max_width = 600
max_height = 900

[opener]
edit = [
  { run = '${EDITOR:-nvim} "$@"', desc = "$EDITOR", block = true, for = "unix" },
]
open = [
  { run = 'open "$@"', desc = "Open", for = "macos" },
]
reveal = [
  { run = 'open -R "$1"', desc = "Reveal in Finder", for = "macos" },
]

[open]
prepend_rules = [
  { mime = "application/{json,ndjson,javascript,x-yaml,toml,xml}", use = ["edit", "reveal"] },
  { url = "*.{md,mdx,env,lock,lua,ts,tsx,rb,go,rs,py,sh,zsh}", use = ["edit", "reveal"] },
]
